# site.yaml
---
- name: Configure Web Servers
  hosts: webservers
  become: yes
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required packages
      apt:
        name: "{{ item }}"
        state: present
      loop:
        - python3
        - python3-pip

    - name: Install Flask using pip3
      pip:
        name: flask
        executable: pip3

    - name: Create application directory
      file:
        path: /opt/flaskapp
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: Stop Flask application if running
      systemd:
        name: flaskapp
        state: stopped
      ignore_errors: yes

    - name: Copy Flask application file
      copy:
        src: application2.py
        dest: /opt/flaskapp/application2.py
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'

    - name: Copy systemd service file
      template:
        src: templates/flaskapp.service.j2
        dest: /etc/systemd/system/flaskapp.service
        owner: root
        group: root
        mode: '0644'

    - name: Reload systemd daemon, enable and start flaskapp service
      systemd:
        name: flaskapp
        daemon_reload: yes
    
    - name: Start Flask application
      systemd:
        name: flaskapp
        state: started
        enabled: yes
      register: service_start

    - name: Show service start status
      debug:
        var: service_start
    
    - name: Wait for Flask application to start
      wait_for:
        host: localhost
        port: 5000
        timeout: 30
        delay: 5
      register: flask_status

    - name: Verify Flask application is responding
      uri:
        url: "http://localhost:5000"
        method: GET
        status_code: 200
      register: flask_response
      retries: 3
      delay: 5
      until: flask_response.status == 200
      
    - name: Show Flask application status
      debug:
        msg: "Flask application is running and responding"
      when: flask_response.status == 200

- name: Configure HAProxy Load Balancer
  hosts: loadbalancer
  become: yes
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install HAProxy
      apt:
        name: haproxy
        state: present

    - name: Deploy HAProxy configuration
      template:
        src: templates/haproxy.cfg.j2
        dest: /etc/haproxy/haproxy.cfg
        owner: root
        group: root
        mode: '0644'
      notify: Restart HAProxy # Trigger handler on change

    - name: Ensure HAProxy service is enabled and started
      systemd:
        name: haproxy
        enabled: yes
        state: started

  handlers:
    - name: Restart HAProxy
      systemd:
        name: haproxy
        state: restarted

- name: Verify Application Deployment
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    min_required_responses: 3   
  tasks:
    - name: Wait for HAProxy to be available
      wait_for:
        host: "{{ haproxy_public_ip }}"
        port: 80
        timeout: 30
        delay: 5
        
    - name: Send multiple requests to test load balancing
      uri:
        url: "http://{{ haproxy_public_ip }}/"
        method: GET
        return_content: yes
        status_code: 200
      register: responses
      loop: "{{ range(9) | list }}"  # Send 9 requests to ensure we hit all servers
      ignore_errors: no

    - name: Extract unique server responses
      set_fact:
        unique_servers: "{{ responses.results | map(attribute='content') | list | unique | list }}"

    - name: Display all received responses
      debug:
        msg: "Received response: {{ item }}"
      loop: "{{ unique_servers }}"

    - name: Verify all web servers responded
      assert:
        that:
          - unique_servers | length >= min_required_responses
        fail_msg: "Not all web servers responded. Only got responses from {{ unique_servers | length }} servers"
        success_msg: "Successfully received responses from all {{ min_required_responses }} web servers"s