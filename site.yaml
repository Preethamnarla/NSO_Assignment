- name: Configure Web Servers
  hosts: webservers
  become: yes
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
    
    - name: Install required packages
      apt:
        name: "{{ item }}"
        state: present
      loop:
        - python3
        - python3-pip

    - name: Install Flask using pip3
      pip:
        name:
          - flask
          - gunicorn
        executable: pip3

    - name: create application directory
      file:
        path: "/home/flask-app/"
        state: directory

    - name: Copy Flask application file
      copy:
        src: "application2.py"
        dest: "/home/flask-app/app.py"
    
    - name: start flask app
      shell: |
        cd /home/flask-app/
        gunicorn --bind 0.0.0.0:80 app:app&

    - name: Verify Flask application is responding
      uri:
        url: "http://localhost:80"
        method: GET
        status_code: 200
      register: flask_response
      retries: 3
      delay: 5
      until: flask_response.status == 200
      
    - name: Show Flask application status
      debug:
        msg: "Flask application is running and responding"
      when: flask_response.status == 200
        
- name: Configure HAProxy Load Balancer
  hosts: HAproxy
  become: yes
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install HAProxy
      apt:
        name: haproxy
        state: present
    
    - name: gather server ip addresses
      setup:
        filter: ansible_default_ipv4.address 

    - name: Deploy HAProxy configuration
      template:
        src: templates/haproxy.cfg.j2
        dest: /etc/haproxy/haproxy.cfg
        owner: root
        group: root
        mode: '0644'
      notify: Restart HAProxy

    - name: Ensure HAProxy service is enabled and started
      systemd:
        name: haproxy
        enabled: yes
        state: started

  handlers:
    - name: Restart HAProxy
      systemd:
        name: haproxy
        state: restarted